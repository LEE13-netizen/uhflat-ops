<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>통합 업무 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* v0.9 형식 정리 — 방향: 공항·호텔 안내 표지판
   누가: 프론트(20~30대), 외주 키핑(나이 많은 분, 야간 외국인 근무자), 시설. 대부분 서서 휴대폰으로 봄
   할 일: 어느 객실이 손이 필요한지 한눈에 보고 한 번에 누른다
   COLOUR 주간은 맑은 회청 바탕 + 흰 판 + 짙은 청록 신호색. 야간은 눈부심을 줄인 남청 바탕(순수 검정 아님)
          상태색은 정보: 초록=끝남·입실 가능, 파랑=퇴실, 청록=진행, 호박=대기, 빨강=긴급
   TYPE 본문 Noto Sans KR(작은 화면 가독), 객실 번호·숫자는 Barlow Semi Condensed(도로 안내 표지 계열, 숫자가 크고 또렷함)
   SIZE 본문 16px, 누르는 곳 44px 이상, "글자 크게"를 누르면 화면 전체 1.15배
   ONE BOLD THING 객실 번호를 표지판처럼 크게. 나머지는 조용하게 */
:root{color-scheme:light dark;
--bg:light-dark(#EDF1F4,#0F1720);
--card:light-dark(#FFFFFF,#18222D);
--ink:light-dark(#16212C,#E9EEF2);
--muted:light-dark(#4D5B69,#A8B5C2);
--line:light-dark(#C5D0DA,#334252);
--soft:light-dark(#E1E7EC,#223040);
--accent:light-dark(#00727A,#5CC8C2);
--accent-bg:light-dark(#DDF0F0,#173B3D);
--on-accent:light-dark(#FFFFFF,#0F1720);
--hot:light-dark(#C0262D,#FF7A72);
--hot-bg:light-dark(#FCE8E8,#3A1D20);
--warn:light-dark(#8A5A00,#F2B84B);
--warn-bg:light-dark(#FFF1D6,#3A2E14);
--ok:light-dark(#1E7A43,#6FD49A);
--ok-bg:light-dark(#DFF3E6,#16352A);
--outc:light-dark(#2C62B4,#7FB2FF);
--out-bg:light-dark(#E1EBF8,#1B2C45);
--radius:12px;
}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,3vw)}
header{background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:14px}
.mark{font:700 20px/1 "Barlow Semi Condensed","Noto Sans KR",sans-serif;letter-spacing:.02em}
.mark small{display:block;font:500 12.5px/1.4 "Noto Sans KR",sans-serif;color:var(--muted);letter-spacing:0;margin-top:4px}
.me{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.me input,.me select{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:16px}
.me input{width:9em}
.badge{font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.db{background:var(--accent-bg);color:var(--accent)}
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-bottom:12px}
.roles button{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:600;cursor:pointer;position:relative}
.roles button[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.roles .n{position:absolute;top:-7px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--hot);color:#fff;font-size:12px;line-height:20px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-top:1px solid var(--soft)}
nav.tabs button{flex:none;border:0;background:none;padding:11px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;cursor:pointer}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .later{font-size:11.5px;color:var(--muted);margin-left:4px}
main{padding-top:18px;padding-bottom:40px;min-width:0}
[hidden]{display:none!important}
.alert{display:none;background:var(--hot-bg);color:var(--hot);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--soft);border-radius:8px;padding:16px;margin-bottom:18px}
.card h2{font-size:16.5px;font-weight:600;margin:0 0 4px;display:flex;align-items:baseline;gap:8px}
.card h2 .c{font:600 14px "Barlow Semi Condensed","Noto Sans KR",sans-serif;color:var(--muted)}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.chips button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);font-weight:600}
.list{display:grid;gap:8px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 12px;border:1px solid var(--soft);border-radius:8px;background:var(--bg);cursor:pointer}
.task:hover{border-color:var(--line)}
.task.hot{border-color:var(--hot);background:var(--hot-bg)}
.task .room{font:700 15px "Barlow Semi Condensed","Noto Sans KR",sans-serif;min-width:3.2em;text-align:center}
.task .room.none{font:500 12px "Noto Sans KR",sans-serif;color:var(--muted)}
.task .t{font-weight:600;overflow-wrap:anywhere}
.task .meta{grid-column:2;font-size:12.5px;color:var(--muted)}
.task .go{grid-row:1/span 2;grid-column:3}
.pri{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.pri.긴급{background:var(--hot);color:#fff}.pri.주의{background:var(--warn);color:#fff}.pri.일반{display:none}
.st{white-space:nowrap}
.late{color:var(--hot);font-weight:600}
.btn{height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.roles button:focus-visible,.task:focus-visible,nav.tabs button:focus-visible,.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center}
form.new{display:grid;gap:10px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:16px;color:var(--ink)}
label.f textarea{height:84px;padding:8px 10px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--ink);font-weight:700}
.seg button.긴급[aria-pressed=true]{border-color:var(--hot);color:var(--hot);background:var(--hot-bg)}
.msg{font-size:13px;min-height:1.2em;color:var(--muted)}
.msg.err{color:var(--hot)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.later-box{text-align:center;padding:40px 16px}
.later-box h2{justify-content:center}
.later-box ul{display:inline-block;text-align:left;color:var(--muted);margin:8px 0 0}
dialog{border:0;border-radius:12px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100% - 24px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgb(0 0 0/.35)}
.dlg{padding:18px}
.dlg h3{margin:0 0 4px;font-size:18px;overflow-wrap:anywhere}
.dlg .meta{color:var(--muted);font-size:13px;margin-bottom:12px}
.dlg .detail{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;overflow-wrap:anywhere}
.dlg .acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.dlg .cmt{display:flex;gap:8px;margin-bottom:14px}
.dlg .cmt input{flex:1;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:16px}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--soft)}
.tl li{padding:0 0 10px 14px;position:relative;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.tl b{font-weight:600}
.tl .w{color:var(--muted);font-size:12.5px}
.x{float:right;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);width:44px;height:44px;margin:-12px -12px 0 0}
.pair{display:flex;gap:6px}.pair select{flex:0 0 5.2em}.pair input{flex:1}
.task .room small{display:block;font:600 11px "Noto Sans KR",sans-serif;color:var(--muted)}
.rbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.rbar .chips{margin:0}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:6px 10px;margin:4px 0 10px}.qcell{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 10px;font-size:14px}.qcell input{width:56px;text-align:center;padding:6px 4px}
.tbadge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--hot);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700}
.chips.dates{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:2px}.chips.dates button{flex:none}
.rbar input[type=search]{height:40px;width:9em;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:16px}
.tg{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer;min-height:32px}
.tg input{width:18px;height:18px;accent-color:var(--accent)}
.sums{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.sum,.chip{font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.sum b{font:600 12.5px "Barlow Semi Condensed","Noto Sans KR",sans-serif;color:var(--ink)}
.out{background:var(--out-bg);color:var(--outc)}.in{background:var(--ok-bg);color:var(--ok)}.stay{background:var(--accent-bg);color:var(--accent)}.free{background:var(--soft);color:var(--muted)}
.chip.k{background:none;border:1px solid var(--line);color:var(--ink)}.chip.warn{background:none;border:1px solid var(--warn);color:var(--warn)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.isu-c{border:1px solid var(--soft);border-radius:8px;padding:10px 12px;background:var(--bg)}
.isu-c.hot{border-color:var(--hot);background:var(--hot-bg)}
.isu-c.loose{border-style:dashed;border-color:var(--line)}
.isu-h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.isu-n{font:700 19px "Barlow Semi Condensed","Noto Sans KR",sans-serif}.isu-n small{font:600 11.5px "Noto Sans KR",sans-serif;color:var(--muted);margin-right:4px}.isu-n.sm{font:700 15px "Noto Sans KR",sans-serif}
.isu-t{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs,.isu-s{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.rtasks{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px}
.rtasks a{color:var(--ink);text-decoration:none;font-weight:600;display:block;overflow-wrap:anywhere}
.rtasks a:hover{text-decoration:underline}
.w{color:var(--muted);font-size:12.5px;display:block}
.stf{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;margin:2px 0;cursor:pointer;font-size:13.5px}.stf.off{color:var(--muted);text-decoration:line-through}
.bsec h2{margin-bottom:10px}
.floor{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--soft)}
.floor:first-of-type{border-top:0}
.fl{font:600 12.5px "Barlow Semi Condensed","Noto Sans KR",sans-serif;color:var(--muted);padding-top:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;padding-top:4px}
.tile{position:relative;height:56px;border:1px solid var(--line);border-radius:8px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0 4px 4px}
.tile .tn{font:700 15px/1 "Barlow Semi Condensed","Noto Sans KR",sans-serif}
.tile .ts{font-size:11.5px;color:var(--muted);line-height:1.2}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:0 0 7px 7px;background:transparent}
.tile.st-out::after{background:var(--outc)}.tile.st-in::after{background:var(--ok)}.tile.st-stay::after{background:var(--accent)}.tile.st-free::after{background:var(--soft)}
.tile.has{border:2px solid var(--accent)}
.tile.hot{border:2px solid var(--hot)}
.tile .tb{position:absolute;top:-7px;right:-6px;z-index:1;min-width:18px;height:18px;padding:0 4px;border-radius:9px;box-shadow:0 0 0 2px var(--card);background:var(--accent);color:#fff;font:700 11px/17px "Barlow Semi Condensed","Noto Sans KR",sans-serif}
.tile.hot .tb{background:var(--hot)}
.tile .tm{position:absolute;top:5px;left:5px;width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.55}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes blink{0%,100%{background:var(--card)}50%{background:var(--accent-bg)}}
@keyframes blinkhot{0%,100%{background:var(--card)}50%{background:var(--hot-bg)}}
.tile.need{animation:blink 1.1s ease-in-out infinite}
.tile.need.hot{animation:blinkhot .8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.tile.need{animation:none;background:var(--accent-bg);outline:2px dashed var(--accent);outline-offset:-5px}.tile.need.hot{background:var(--hot-bg);outline-color:var(--hot)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:5px}
.lg::before{content:"";width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:var(--card)}
.lg.need::before{background:var(--accent-bg);border-color:var(--accent)}.lg.has::before{border:2px solid var(--accent)}.lg.hot::before{border:2px solid var(--hot)}
.lg.st-out::before{background:var(--outc);border:0;height:5px}.lg.st-in::before{background:var(--ok);border:0;height:5px}.lg.st-stay::before{background:var(--accent);border:0;height:5px}.lg.st-free::before{background:var(--soft);border:0;height:5px}
.lg.tmx::before{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.55;border:0}
.needbtn{border:0;border-radius:999px;background:var(--hot-bg);color:var(--hot);font-weight:600;padding:6px 12px;cursor:pointer}
.needbtn[aria-pressed=true]{outline:2px solid var(--hot)}
.dlg h4{margin:16px 0 8px;font-size:15px;display:flex;gap:6px;align-items:baseline}
.dlg h4 .c{font:600 13px "Barlow Semi Condensed","Noto Sans KR",sans-serif;color:var(--muted)}
.lnk{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;margin-left:auto}
#backRoom{margin:0 0 6px}
.notes{display:grid;gap:8px}
.note{border:1px solid var(--soft);border-radius:8px;padding:8px 10px;background:var(--bg)}
.note.mine{border-color:var(--accent)}
.nh{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.nt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.note textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px 10px;font-size:16px;color:var(--ink)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg2 button{border:0;background:var(--card);padding:7px 14px;font-weight:600;cursor:pointer;min-height:36px}
.seg2 button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.nb{display:inline-block;min-width:17px;padding:0 4px;border-radius:9px;background:var(--hot);color:#fff;font:700 11px/17px "Barlow Semi Condensed","Noto Sans KR",sans-serif;margin-left:2px}
.fls{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.fls button{flex:none}
.pv{position:relative;overflow:hidden;touch-action:none;height:360px;border:1px solid var(--soft);border-radius:8px;background:var(--bg);user-select:none;-webkit-user-select:none;cursor:grab}
.pz{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.pz svg{display:block;overflow:visible}
.zb{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zb button{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:600 18px/1 "Noto Sans KR",sans-serif;cursor:pointer;color:var(--ink)}
.zb button[data-zoom=fit]{font-size:12px}
.pf rect{fill:var(--soft);stroke:none}.pf.core rect{fill:none;stroke:var(--line);stroke-dasharray:4 3}
.pf text{font:500 12px "Noto Sans KR",sans-serif;fill:var(--muted)}
.pf.label rect{fill:none}.pf.label text{font:700 13px "Noto Sans KR",sans-serif;fill:var(--ink)}
.pf.core rect{fill:var(--accent-bg);stroke:var(--accent);stroke-dasharray:none}.pf.core text{font:700 13px "Barlow Semi Condensed","Noto Sans KR",sans-serif;fill:var(--accent)}
.pr{cursor:pointer}
.pr rect.bg{fill:var(--card);stroke:var(--line);stroke-width:1}
.pr .bar{fill:transparent}.pr.st-out .bar{fill:var(--outc)}.pr.st-in .bar{fill:var(--ok)}.pr.st-stay .bar{fill:var(--accent)}.pr.st-free .bar{fill:var(--soft)}
.pr.has rect.bg{stroke:var(--accent);stroke-width:2.5}.pr.hot rect.bg{stroke:var(--hot);stroke-width:2.5}
.pr.hit rect.bg{stroke:var(--ink);stroke-width:3}
.pr.stray rect.bg{stroke-dasharray:4 3}
.pr text.no{font:700 15px "Barlow Semi Condensed","Noto Sans KR",sans-serif;fill:var(--ink)}
.pr text.sy{font:500 11px "Noto Sans KR",sans-serif;fill:var(--muted)}
.pr .bd{fill:var(--accent)}.pr.hot .bd{fill:var(--hot)}.pr .bdt{font:700 11px "Barlow Semi Condensed","Noto Sans KR",sans-serif;fill:#fff}
.pr .nd{fill:var(--ink);opacity:.55}
@keyframes pblink{0%,100%{fill:var(--card)}50%{fill:var(--accent-bg)}}
@keyframes pblinkhot{0%,100%{fill:var(--card)}50%{fill:var(--hot-bg)}}
.pr.need rect.bg{animation:pblink 1.1s ease-in-out infinite}
.pr.need.hot rect.bg{animation:pblinkhot .8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.pr.need rect.bg{animation:none;fill:var(--accent-bg);stroke-dasharray:5 3}.pr.need.hot rect.bg{fill:var(--hot-bg)}}
.demo{background:var(--accent-bg);color:var(--accent);border-radius:8px;padding:8px 12px;margin:0 0 8px;font-size:13.5px;font-weight:600}
.slist{display:grid;gap:8px}
.srow{border:1px solid var(--soft);border-radius:8px;padding:9px 11px;background:var(--bg)}
.srow.pend{border-color:var(--accent)}
.srow.blinkrow{animation:blink 1.1s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.srow.blinkrow{animation:none;background:var(--accent-bg)}}
